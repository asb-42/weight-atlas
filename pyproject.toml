[project]
name = "weight-atlas"
version = "0.2.0"
description = "LLM weight fingerprinting and topographic visualization"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "safetensors>=0.4",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tifffile>=2024.2",
    "ml-dtypes>=0.5.4",
    "gguf>=0.19.0",
    # Runtime BLAS thread control for the parallel statistics workers.
    "threadpoolctl>=3.1",
    # Web UI (core: the UI is the primary interface for scan/render/compare)
    "fastapi>=0.100",
    "jinja2>=3.1",
    "httpx>=0.24",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
blender = []
umap = ["umap-learn>=0.5"]
activity = ["torch>=2.0", "transformers>=4.30"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.9", "scipy-stubs>=1.15"]

[project.scripts]
weight-atlas = "weight_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weight_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_any_generics = false

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
