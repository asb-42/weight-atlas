{% extends "base.html" %}
{% block title %}Model Detail — Weight Atlas{% endblock %}
{% block content %}
<h2>{{ job.model_path }}</h2>
<p><a href="/">← Back to models</a></p>

{% include "_model_tabs.html" %}

<div id="model-tab-content">
    {{ tab_content | safe }}
</div>
{% endblock %}

{% block scripts %}
<script>
    // Highlight the active tab after an htmx swap, mirroring the server's
    // aria-selected state for the pushed URL.
    document.body.addEventListener("htmx:afterSwap", function (e) {
        if (!e.target || e.target.id !== "model-tab-content") return;
        const tab = new URLSearchParams(window.location.search).get("tab") || "overview";
        document.querySelectorAll("#model-tabs .model-tab").forEach(function (a) {
            const active = a.dataset.tab === tab;
            a.classList.toggle("model-tab--active", active);
            a.setAttribute("aria-selected", active ? "true" : "false");
        });
    });
</script>
{% endblock %}
